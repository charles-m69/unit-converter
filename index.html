<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unit Converter</title>

    <link rel="stylesheet" href="index.css">
</head>
<body>
    <div class="headbox">
        <h1 id="title">Metric/Imperial Unit Conversion</h1>
        
        <input type="text" name="" id="num-input">
        <button type="submit" id="conv-btn">Convert</button>
    </div>

    <div class="section">
        <div class="main-con">
            <h3>Length (Meter/Feet)</h3>
            <div class="container" id="len-box">
                <p id="len"></p>
            </div>
        </div>
        
        <div class="main-con">
            <h3>Volume (Liters/Gallons)</h3>
            <div class="container" id="vol-box">
                <p id="vol"></p>
            </div>
        </div>

        <div class="main-con">
            <h3>Mass (Kilograms/Pounds)</h3>
            <div class="container" id="mass-box">
                <p id="mas"></p>
            </div>
        </div>
    </div>
    
    <hr width="90%" style="color: rgb(174, 148, 216);">
    <p style="color: rgb(174, 148, 216); margin: 10px 5%;">Homework by Charles M.</p>

    <script src="index.js"></script>
</body>
</html>
